<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>15 Años Sara Lucía</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#ffe6f2,#fff);
text-align:center;
overflow-x:hidden;
color:#444;
}

/* portada */

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(rgba(255,255,255,0.7),rgba(255,255,255,0.9)),
url("https://images.unsplash.com/photo-1492684223066-81342ee5ff30");
background-size:cover;
background-position:center;
}

.hero h1{
font-family:'Great Vibes',cursive;
font-size:90px;
color:#d4af37;
margin:0;
}

.hero p{
font-size:25px;
}

/* tarjetas */

.section{
padding:70px 20px;
max-width:700px;
margin:auto;
}

.card{
background:white;
border-radius:20px;
padding:40px;
margin:30px 0;
box-shadow:0 20px 40px rgba(0,0,0,0.1);
}

h2{
color:#d4af37;
}

.button{
display:inline-block;
padding:15px 35px;
margin-top:20px;
background:#d4af37;
color:white;
border-radius:30px;
text-decoration:none;
font-weight:500;
transition:.3s;
}

.button:hover{
transform:scale(1.1);
background:#c59b2f;
}

/* contador */

.countdown{
font-size:35px;
font-weight:bold;
color:#d4af37;
margin-top:10px;
}

/* pétalos */

.petalo{
position:fixed;
top:-10px;
width:15px;
height:15px;
background:pink;
opacity:.7;
border-radius:50%;
animation:caer linear infinite;
}

@keyframes caer{
to{
transform:translateY(110vh) rotate(360deg);
}
}

</style>

</head>

<body>

<div class="hero">

<h1>Sara Lucía</h1>
<p>Mis 15 Años</p>

</div>

<section class="section">

<div class="card">

<h2>Cuenta Regresiva</h2>

<div id="contador" class="countdown"></div>

</div>

<div class="card">

<h2>Recepción</h2>

<p>
7:00 PM<br>
Edificio Milenium<br>
Villamaría<br>
Carrera 5 #10-06
</p>

</div>

<div class="card">

<h2>Código de Vestimenta</h2>

<p>Formal</p>

<p>
Colores reservados:<br>
<strong>Oro • Rosa • Marfil • Beige</strong>
</p>

</div>

<div class="card">

<h2>Ubicación</h2>

<a class="button"
href="https://maps.google.com/?q=Edificio+Milenium+Villamaria+Caldas"
target="_blank">

Ver ubicación

</a>

</div>

<div class="card">

<h2>Confirmar asistencia</h2>

<a class="button"
href="https://wa.me/573000000000?text=Confirmo%20mi%20asistencia%20a%20los%2015%20de%20Sara%20Lucia">

Confirmar por WhatsApp

</a>

</div>

</section>

<audio autoplay loop>

<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8c0c1db3b0.mp3?filename=wedding-piano-110624.mp3">

</audio>

<script>

/* contador */

var fechaEvento = new Date("Dec 20, 2026 19:00:00").getTime();

setInterval(function(){

var ahora = new Date().getTime();

var distancia = fechaEvento - ahora;

var d = Math.floor(distancia/(1000*60*60*24));
var h = Math.floor((distancia%(1000*60*60*24))/(1000*60*60));
var m = Math.floor((distancia%(1000*60*60))/(1000*60));
var s = Math.floor((distancia%(1000*60))/1000);

document.getElementById("contador").innerHTML =
d+"d "+h+"h "+m+"m "+s+"s";

},1000);


/* pétalos */

for(let i=0;i<30;i++){

let p=document.createElement("div");
p.className="petalo";

p.style.left=Math.random()*100+"vw";
p.style.animationDuration=5+Math.random()*5+"s";

document.body.appendChild(p);

}

</script>

</body>
</html>
