<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>15 Años Sara Lucia</title>

<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Montserrat',sans-serif;
background:linear-gradient(135deg,#ffe4f0,#ffffff);
text-align:center;
color:#444;
}

/* SOBRE */

#sobre{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

#sobre h1{
font-family:'Parisienne',cursive;
font-size:70px;
color:#d4af37;
}

.boton{
padding:15px 35px;
background:#d4af37;
color:white;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
}

/* CONTENIDO */

#contenido{
display:none;
padding:50px 20px;
max-width:700px;
margin:auto;
}

.card{
background:white;
padding:35px;
margin:25px 0;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,0.1);
}

h2{
color:#d4af37;
}

/* CONTADOR */

.countdown{
font-size:32px;
font-weight:bold;
color:#d4af37;
}

/* BOTONES */

.button{
display:inline-block;
padding:14px 30px;
background:#d4af37;
color:white;
text-decoration:none;
border-radius:30px;
margin-top:15px;
}

</style>

</head>

<body>

<div id="sobre">

<h1>Sara Lucia</h1>

<p>Mis 15 Años</p>

<button class="boton" onclick="abrir()">
Abrir invitación
</button>

</div>

<div id="contenido">

<div class="card">

<h2>Cuenta regresiva</h2>

<div id="contador" class="countdown"></div>

</div>

<div class="card">

<h2>Recepción</h2>

<p>
7:00 PM<br>
Edificio Milenium<br>
Villamaría<br>
Carrera 5 #10-06
</p>

</div>

<div class="card">

<h2>Código de vestimenta</h2>

<p>Formal</p>

<p>
Colores reservados:<br>
Oro • Rosa • Marfil • Beige
</p>

</div>

<div class="card">

<h2>Confirmar asistencia</h2>

<form action="https://formsubmit.co/tuemail@gmail.com" method="POST">

<input type="text" name="Nombre" placeholder="Tu nombre" required><br><br>

<input type="number" name="Acompañantes" placeholder="Número de acompañantes"><br><br>

<button class="button" type="submit">

Confirmar asistencia

</button>

</form>

</div>

<div class="card">

<h2>Agregar al calendario</h2>

<a class="button" href="evento.ics">

Agregar evento al calendario

</a>

</div>

</div>

<script>

function abrir(){

document.getElementById("sobre").style.display="none";

document.getElementById("contenido").style.display="block";

}

/* contador */

var fechaEvento = new Date("Dec 20, 2026 19:00:00").getTime();

setInterval(function(){

var ahora = new Date().getTime();

var distancia = fechaEvento - ahora;

var d = Math.floor(distancia/(1000*60*60*24));
var h = Math.floor((distancia%(1000*60*60*24))/(1000*60*60));
var m = Math.floor((distancia%(1000*60*60))/(1000*60));
var s = Math.floor((distancia%(1000*60))/1000);

document.getElementById("contador").innerHTML =
d+"d "+h+"h "+m+"m "+s+"s";

},1000);

</script>

</body>
</html>
